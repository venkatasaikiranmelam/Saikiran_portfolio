on:
  workflow_dispatch:
  push:
    branches: [main]        # you currently have 'master' — change if your repo uses 'main'
  schedule:
    - cron: "0 12 * * 1"

jobs:
  build-and-deploy:
    if: ${{ github.event_name != 'schedule' }}   # skips the cron
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install -g npm@latest
      - run: |
          npm install
          npm run build
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # ← use the correct input name 'token'
          branch: gh-pages
          folder: build
